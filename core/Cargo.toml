[package]
name    = "mcp-core"
version = "0.1.0"
edition = "2021"
description = "MCP Station 的内核：本机常驻的 MCP 网关（托管所有 MCP，客户端连同一个地址）"

[[bin]]
name = "mcp-core"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "fs", "net"] }
tokio-util   = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum         = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
futures      = "0.3"
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1", features = ["preserve_order"] }
reqwest      = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap      = "6"
uuid         = { version = "1", features = ["v4", "fast-rng"] }
thiserror    = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "user"] }

[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1
# 不用 panic = "abort"：一个会话或一个上游的 panic 只该挂掉它自己的 task，不能带走整个内核和所有 MCP。
strip     = true
